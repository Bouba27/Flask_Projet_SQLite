<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche de Livres</title>
</head>
<body>
    <h1>Recherche de Livres Disponibles</h1>
    <form method="POST" action="/search_books">
        <input type="text" name="query" placeholder="Rechercher par titre, auteur ou catégorie" value="{{ query }}">
        <button type="submit">Rechercher</button>
    </form>

    {% if books %}
    <h2>Résultats de la recherche</h2>
    <ul>
        {% for book in books %}
        <li>
            <strong>{{ book[1] }}</strong> par {{ book[2] }} - Catégorie : {{ book[3] }}
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>Aucun livre disponible trouvé.</p>
    {% endif %}
</body>
</html>
